<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - NavIcon</title>
    <link rel="stylesheet" href="techon-nav-icon.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { display: flex; flex-direction: column; gap: 24px; max-width: 800px; margin: 0 auto; }
        .demo-section { background: white; padding: 24px; border-radius: 12px; border: 1px solid #eee; }
        .demo-section h2 { margin: 0 0 20px 0; font-size: 16px; color: #666; text-transform: uppercase; }
        .demo-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        .demo-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: white; border: 1px solid #eee; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-section">
            <h2>Basic NavIcons</h2>
            <div class="demo-row">
                <button class="to-nav-icon" data-icon="menu"></button>
                <button class="to-nav-icon" data-icon="search"></button>
                <button class="to-nav-icon" data-icon="user"></button>
                <button class="to-nav-icon" data-icon="settings"></button>
                <button class="to-nav-icon" data-icon="home"></button>
                <button class="to-nav-icon" data-icon="heart"></button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Sizes</h2>
            <div class="demo-row">
                <button class="to-nav-icon" data-size="xs" data-icon="menu"></button>
                <button class="to-nav-icon" data-size="s" data-icon="menu"></button>
                <button class="to-nav-icon" data-size="m" data-icon="menu"></button>
                <button class="to-nav-icon" data-size="l" data-icon="menu"></button>
                <button class="to-nav-icon" data-size="xl" data-icon="menu"></button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Variants</h2>
            <div class="demo-row">
                <button class="to-nav-icon" data-variant="ghost" data-icon="home"></button>
                <button class="to-nav-icon" data-variant="outline" data-icon="search"></button>
                <button class="to-nav-icon" data-variant="solid" data-icon="star"></button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Active States</h2>
            <div class="demo-row">
                <button class="to-nav-icon" data-icon="home"></button>
                <button class="to-nav-icon" data-icon="search" data-active="true"></button>
                <button class="to-nav-icon" data-icon="user"></button>
                <button class="to-nav-icon" data-icon="settings" data-active="true"></button>
            </div>
        </div>

        <div class="demo-section">
            <h2>With Badges</h2>
            <div class="demo-row">
                <button class="to-nav-icon" data-icon="bell" data-badge="true"></button>
                <button class="to-nav-icon" data-icon="mail" data-count="3"></button>
                <button class="to-nav-icon" data-icon="message" data-count="99"></button>
                <button class="to-nav-icon" data-icon="notification" data-count="12"></button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Radius</h2>
            <div class="demo-row">
                <button class="to-nav-icon" data-radius="none" data-icon="close"></button>
                <button class="to-nav-icon" data-radius="s" data-icon="close"></button>
                <button class="to-nav-icon" data-radius="m" data-icon="close"></button>
                <button class="to-nav-icon" data-radius="l" data-icon="close"></button>
                <button class="to-nav-icon" data-radius="xl" data-icon="close"></button>
                <button class="to-nav-icon" data-radius="full" data-icon="close"></button>
            </div>
        </div>

        <div class="demo-section">
            <h2>States</h2>
            <div class="demo-row">
                <button class="to-nav-icon" data-icon="check"></button>
                <button class="to-nav-icon" data-icon="close" data-disabled="true"></button>
                <button class="to-nav-icon" data-icon="sync" data-loading="true"></button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Icon Groups</h2>
            <div class="to-nav-icon-group">
                <button class="to-nav-icon" data-icon="grid" data-active="true"></button>
                <button class="to-nav-icon" data-icon="list"></button>
                <button class="to-nav-icon" data-icon="table"></button>
            </div>
            
            <div class="to-nav-icon-group" style="margin-top: 12px;">
                <button class="to-nav-icon" data-icon="align-left" data-active="true"></button>
                <button class="to-nav-icon" data-icon="align-center"></button>
                <button class="to-nav-icon" data-icon="align-right"></button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Use Cases</h2>
            
            <h3>Navigation Bar</h3>
            <div class="demo-bar">
                <button class="to-nav-icon" data-icon="menu"></button>
                <span style="flex: 1; text-align: center;">Dashboard</span>
                <button class="to-nav-icon" data-icon="search"></button>
                <button class="to-nav-icon" data-icon="bell" data-count="3"></button>
                <button class="to-nav-icon" data-icon="user"></button>
            </div>
            
            <h3>Mobile Header</h3>
            <div class="demo-bar" style="justify-content: space-between;">
                <button class="to-nav-icon" data-icon="menu"></button>
                <span style="font-weight: bold;">App Name</span>
                <button class="to-nav-icon" data-icon="bell" data-badge="true"></button>
            </div>
            
            <h3>Sidebar Icons</h3>
            <div style="display: flex; flex-direction: column; gap: 8px; width: fit-content; padding: 16px; background: white; border: 1px solid #eee; border-radius: 12px;">
                <button class="to-nav-icon" data-icon="home" data-active="true"></button>
                <button class="to-nav-icon" data-icon="search"></button>
                <button class="to-nav-icon" data-icon="heart" data-count="5"></button>
                <button class="to-nav-icon" data-icon="user"></button>
                <button class="to-nav-icon" data-icon="settings"></button>
            </div>
            
            <h3>Tab Bar</h3>
            <div style="display: flex; gap: 4px; padding: 4px; background: #f5f5f5; border-radius: 12px;">
                <button class="to-nav-icon" data-icon="home" data-active="true"></button>
                <button class="to-nav-icon" data-icon="search"></button>
                <button class="to-nav-icon" data-icon="heart"></button>
                <button class="to-nav-icon" data-icon="user"></button>
            </div>
            
            <h3>Action Bar</h3>
            <div class="demo-bar">
                <button class="to-nav-icon" data-icon="edit"></button>
                <button class="to-nav-icon" data-icon="copy"></button>
                <button class="to-nav-icon" data-icon="delete"></button>
                <button class="to-nav-icon" data-icon="share"></button>
                <button class="to-nav-icon" data-icon="download"></button>
            </div>
        </div>

        <div class="demo-section">
            <h2>With Tooltips</h2>
            <div class="demo-row">
                <div class="to-tooltip">
                    <button class="to-nav-icon" data-icon="home"></button>
                    <span class="to-tooltip-content" data-position="top">Home</span>
                </div>
                
                <div class="to-tooltip">
                    <button class="to-nav-icon" data-icon="search"></button>
                    <span class="to-tooltip-content" data-position="top">Search</span>
                </div>
                
                <div class="to-tooltip">
                    <button class="to-nav-icon" data-icon="bell" data-count="3"></button>
                    <span class="to-tooltip-content" data-position="top">Notifications</span>
                </div>
                
                <div class="to-tooltip">
                    <button class="to-nav-icon" data-icon="user"></button>
                    <span class="to-tooltip-content" data-position="top">Profile</span>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>All Icons</h2>
            <div class="demo-row" style="gap: 12px;">
                <button class="to-nav-icon" data-icon="menu"></button>
                <button class="to-nav-icon" data-icon="close"></button>
                <button class="to-nav-icon" data-icon="search"></button>
                <button class="to-nav-icon" data-icon="user"></button>
                <button class="to-nav-icon" data-icon="settings"></button>
                <button class="to-nav-icon" data-icon="home"></button>
                <button class="to-nav-icon" data-icon="heart"></button>
                <button class="to-nav-icon" data-icon="star"></button>
                <button class="to-nav-icon" data-icon="bell"></button>
                <button class="to-nav-icon" data-icon="mail"></button>
                <button class="to-nav-icon" data-icon="calendar"></button>
                <button class="to-nav-icon" data-icon="clock"></button>
                <button class="to-nav-icon" data-icon="download"></button>
                <button class="to-nav-icon" data-icon="upload"></button>
                <button class="to-nav-icon" data-icon="edit"></button>
                <button class="to-nav-icon" data-icon="delete"></button>
                <button class="to-nav-icon" data-icon="copy"></button>
                <button class="to-nav-icon" data-icon="save"></button>
                <button class="to-nav-icon" data-icon="print"></button>
                <button class="to-nav-icon" data-icon="share"></button>
                <button class="to-nav-icon" data-icon="plus"></button>
                <button class="to-nav-icon" data-icon="minus"></button>
                <button class="to-nav-icon" data-icon="check"></button>
                <button class="to-nav-icon" data-icon="arrow-left"></button>
                <button class="to-nav-icon" data-icon="arrow-right"></button>
                <button class="to-nav-icon" data-icon="arrow-up"></button>
                <button class="to-nav-icon" data-icon="arrow-down"></button>
                <button class="to-nav-icon" data-icon="more"></button>
                <button class="to-nav-icon" data-icon="grid"></button>
                <button class="to-nav-icon" data-icon="list"></button>
            </div>
        </div>
    </div>
    <script src="techon-nav-icon.js"></script>
    <script src="techon-tooltip.js"></script>
</body>
</html>
