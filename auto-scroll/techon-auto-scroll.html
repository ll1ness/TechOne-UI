<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - AutoScroll</title>
    <link rel="stylesheet" href="techon-auto-scroll.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { display: flex; flex-direction: column; gap: 40px; max-width: 800px; margin: 0 auto; }
        .demo-section { background: white; padding: 24px; border-radius: 12px; border: 1px solid #eee; }
        .demo-section h2 { margin: 0 0 20px 0; font-size: 16px; color: #666; text-transform: uppercase; }
        .demo-description { margin: -10px 0 20px 0; color: #666; font-size: 14px; }
        .fade-container { position: relative; width: 100%; }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-section">
            <h2>AutoScroll</h2>
            <div class="demo-description">Basic auto-scrolling logos</div>
            <div class="to-auto-scroll" data-speed="medium" data-hover="pause">
                <div class="to-auto-scroll-track">
                    <span class="to-logo" data-dark="true">Logo 1</span>
                    <span class="to-logo" data-light="true">Logo 2</span>
                    <span class="to-logo" data-dark="true">Logo 3</span>
                    <span class="to-logo" data-light="true">Logo 4</span>
                    <span class="to-logo" data-dark="true">Logo 5</span>
                    <span class="to-logo" data-light="true">Logo 6</span>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Speed</h2>
            <div class="demo-description">Fast speed variant</div>
            <div class="to-auto-scroll" data-speed="fast" data-hover="pause">
                <div class="to-auto-scroll-track">
                    <span class="to-logo" data-dark="true">Logo 1</span>
                    <span class="to-logo" data-light="true">Logo 2</span>
                    <span class="to-logo" data-dark="true">Logo 3</span>
                    <span class="to-logo" data-light="true">Logo 4</span>
                    <span class="to-logo" data-dark="true">Logo 5</span>
                    <span class="to-logo" data-light="true">Logo 6</span>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Fade</h2>
            <div class="demo-description">With fade-in and fade-out effects</div>
            <div class="fade-container">
                <div class="to-fade" data-to="left" data-fill-height="true"></div>
                <div class="to-auto-scroll" data-speed="medium" data-hover="pause" style="padding: 40px 0;">
                    <div class="to-auto-scroll-track">
                        <span class="to-logo" data-dark="true">Logo 1</span>
                        <span class="to-logo" data-light="true">Logo 2</span>
                        <span class="to-logo" data-dark="true">Logo 3</span>
                        <span class="to-logo" data-light="true">Logo 4</span>
                        <span class="to-logo" data-dark="true">Logo 5</span>
                        <span class="to-logo" data-light="true">Logo 6</span>
                    </div>
                </div>
                <div class="to-fade" data-to="right" data-fill-height="true"></div>
            </div>
        </div>
    </div>
    <script src="techon-auto-scroll.js"></script>
</body>
</html>
