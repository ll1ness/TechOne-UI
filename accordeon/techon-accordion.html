<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - Accordion</title>
    <link rel="stylesheet" href="techon-accordion.css">
</head>
<body>
    <div class="to-accordion-group">
        <div class="to-accordion" data-open="true">
            <div class="to-accordion-header">
                <button class="to-accordion-trigger" aria-expanded="true">
                    <span>Example (open by default)</span>
                    <span class="to-accordion-icon">▼</span>
                </button>
            </div>
            <div class="to-accordion-content">
                <div class="to-accordion-content-inner">
                    Example content. This is the content of the accordion that can be shown or hidden.
                </div>
            </div>
        </div>
        <div class="to-accordion" data-open="false">
            <div class="to-accordion-header">
                <button class="to-accordion-trigger" aria-expanded="false">
                    <span>Example (closed)</span>
                    <span class="to-accordion-icon">▼</span>
                </button>
            </div>
            <div class="to-accordion-content">
                <div class="to-accordion-content-inner">
                    Example content. This content is hidden until the accordion is opened.
                </div>
            </div>
        </div>
        <div class="to-accordion" data-open="false">
            <div class="to-accordion-header">
                <button class="to-accordion-trigger" aria-expanded="false">
                    <span>Another example</span>
                    <span class="to-accordion-icon">▼</span>
                </button>
            </div>
            <div class="to-accordion-content">
                <div class="to-accordion-content-inner">
                    <p>You can put any content here:</p>
                    <ul style="margin-top: 8px; padding-left: 20px;">
                        <li>Text elements</li>
                        <li>Lists like this one</li>
                        <li>Or even other components</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script src="techon-accordion.js"></script>
</body>
</html>
