<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - Avatar Group</title>
    <link rel="stylesheet" href="techon-avatar.css">
    <link rel="stylesheet" href="techon-avatar-group.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { display: flex; flex-direction: column; gap: 40px; max-width: 800px; margin: 0 auto; }
        .demo-section { background: white; padding: 24px; border-radius: 12px; border: 1px solid #eee; }
        .demo-section h2 { margin: 0 0 20px 0; font-size: 16px; color: #666; text-transform: uppercase; }
        .demo-row { display: flex; gap: 40px; flex-wrap: wrap; align-items: center; }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-section">
            <h2>AvatarGroup</h2>
            <div class="demo-row">
                <div class="to-avatar-group" data-size="l" data-avatars='[
                    {"src": "/images/avatar.jpg"},
                    {"value": "B"},
                    {"value": "C"},
                    {"value": "D"},
                    {"value": "E"}
                ]'></div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Sizes</h2>
            <div class="demo-row">
                <div class="to-avatar-group" data-size="s" data-avatars='[
                    {"value": "A"},
                    {"value": "B"},
                    {"value": "C"},
                    {"value": "D"}
                ]'></div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Limit</h2>
            <div class="demo-row">
                <div class="to-avatar-group" data-size="m" data-limit="3" data-avatars='[
                    {"value": "A"},
                    {"value": "B"},
                    {"value": "C"},
                    {"value": "D"},
                    {"value": "E"},
                    {"value": "F"},
                    {"value": "G"}
                ]'></div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Reverse order</h2>
            <div class="demo-row" style="flex-direction: column; align-items: flex-start;">
                <div class="to-avatar-group" data-size="m" data-avatars='[
                    {"value": "A"},
                    {"value": "B"},
                    {"value": "C"}
                ]'></div>
                <div class="to-avatar-group" data-size="m" data-reverse="true" data-avatars='[
                    {"value": "A"},
                    {"value": "B"},
                    {"value": "C"}
                ]'></div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Mixed types</h2>
            <div class="demo-row">
                <div class="to-avatar-group" data-size="m" data-avatars='[
                    {"src": "/images/avatar.jpg"},
                    {"value": "B"},
                    {"empty": true},
                    {"value": "D", "statusIndicator": {"color": "green"}}
                ]'></div>
            </div>
        </div>
    </div>
    <script src="techon-avatar.js"></script>
    <script src="techon-avatar-group.js"></script>
</body>
</html>
