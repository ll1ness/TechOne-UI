<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - Skeleton</title>
    <link rel="stylesheet" href="techon-skeleton.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { display: flex; flex-direction: column; gap: 24px; max-width: 800px; margin: 0 auto; }
        .demo-section { background: white; padding: 24px; border-radius: 12px; border: 1px solid #eee; }
        .demo-section h2 { margin: 0 0 20px 0; font-size: 16px; color: #666; text-transform: uppercase; }
        .demo-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .demo-card { width: 250px; padding: 16px; background: #f5f5f5; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-section">
            <h2>Text Skeletons</h2>
            <div class="demo-row" style="flex-direction: column; align-items: stretch;">
                <span class="to-skeleton" data-variant="text" data-width="100"></span>
                <span class="to-skeleton" data-variant="text" data-width="75"></span>
                <span class="to-skeleton" data-variant="text" data-width="50"></span>
                <span class="to-skeleton" data-variant="text" data-width="25"></span>
            </div>
        </div>

        <div class="demo-section">
            <h2>Text Sizes</h2>
            <div class="demo-row" style="flex-direction: column; align-items: stretch;">
                <span class="to-skeleton" data-variant="text" data-size="xs" data-width="50">xs</span>
                <span class="to-skeleton" data-variant="text" data-size="s" data-width="50">s</span>
                <span class="to-skeleton" data-variant="text" data-size="m" data-width="50">m</span>
                <span class="to-skeleton" data-variant="text" data-size="l" data-width="50">l</span>
                <span class="to-skeleton" data-variant="text" data-size="xl" data-width="50">xl</span>
                <span class="to-skeleton" data-variant="text" data-size="xxl" data-width="50">xxl</span>
            </div>
        </div>

        <div class="demo-section">
            <h2>Circle & Rectangle</h2>
            <div class="demo-row">
                <span class="to-skeleton" data-variant="circle" data-size="xl" style="width: 40px; height: 40px;"></span>
                <span class="to-skeleton" data-variant="circle" data-size="l" style="width: 60px; height: 60px;"></span>
                <span class="to-skeleton" data-variant="circle" data-size="xl" style="width: 80px; height: 80px;"></span>
                
                <span class="to-skeleton" data-variant="rectangle" data-size="xl" style="width: 100px; height: 60px;"></span>
                <span class="to-skeleton" data-variant="rectangle" data-size="xl" style="width: 150px; height: 80px;"></span>
            </div>
        </div>

        <div class="demo-section">
            <h2>Animation Types</h2>
            <div class="demo-row" style="flex-direction: column; align-items: stretch;">
                <span class="to-skeleton" data-variant="text" data-animation="shimmer" data-width="100">Shimmer (default)</span>
                <span class="to-skeleton" data-variant="text" data-animation="pulse" data-width="100">Pulse</span>
                <span class="to-skeleton" data-variant="text" data-animation="none" data-width="100">No animation</span>
            </div>
        </div>

        <div class="demo-section">
            <h2>Radius</h2>
            <div class="demo-row">
                <span class="to-skeleton" data-variant="rectangle" data-radius="none" style="width: 60px; height: 60px;">none</span>
                <span class="to-skeleton" data-variant="rectangle" data-radius="s" style="width: 60px; height: 60px;">s</span>
                <span class="to-skeleton" data-variant="rectangle" data-radius="m" style="width: 60px; height: 60px;">m</span>
                <span class="to-skeleton" data-variant="rectangle" data-radius="l" style="width: 60px; height: 60px;">l</span>
                <span class="to-skeleton" data-variant="rectangle" data-radius="xl" style="width: 60px; height: 60px;">xl</span>
                <span class="to-skeleton" data-variant="rectangle" data-radius="full" style="width: 60px; height: 60px;">full</span>
            </div>
        </div>

        <div class="demo-section">
            <h2>Multiple Lines</h2>
            <div class="demo-row" style="flex-direction: column; align-items: stretch;">
                <span class="to-skeleton" data-variant="text" data-count="3" data-width="100"></span>
            </div>
        </div>

        <div class="demo-section">
            <h2>Card Loading State</h2>
            <div class="demo-card">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                    <span class="to-skeleton" data-variant="circle" style="width: 40px; height: 40px;"></span>
                    <div style="flex: 1;">
                        <span class="to-skeleton" data-variant="text" data-width="75" data-size="s"></span>
                        <span class="to-skeleton" data-variant="text" data-width="50" data-size="xs"></span>
                    </div>
                </div>
                <span class="to-skeleton" data-variant="text" data-width="100" data-size="m"></span>
                <span class="to-skeleton" data-variant="text" data-width="100" data-size="m"></span>
                <span class="to-skeleton" data-variant="text" data-width="75" data-size="m"></span>
                <div style="display: flex; gap: 8px; margin-top: 16px;">
                    <span class="to-skeleton" data-variant="rectangle" style="width: 80px; height: 32px;"></span>
                    <span class="to-skeleton" data-variant="rectangle" style="width: 80px; height: 32px;"></span>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Profile Loading</h2>
            <div style="display: flex; gap: 20px;">
                <div style="flex: 1;">
                    <span class="to-skeleton" data-variant="circle" style="width: 80px; height: 80px; margin: 0 auto 16px;"></span>
                    <span class="to-skeleton" data-variant="text" data-width="75" data-size="l" style="margin: 0 auto;"></span>
                    <span class="to-skeleton" data-variant="text" data-width="50" data-size="m" style="margin: 0 auto;"></span>
                </div>
                <div style="flex: 2;">
                    <span class="to-skeleton" data-variant="text" data-width="100" data-size="l"></span>
                    <span class="to-skeleton" data-variant="text" data-width="100" data-size="m"></span>
                    <span class="to-skeleton" data-variant="text" data-width="100" data-size="m"></span>
                    <span class="to-skeleton" data-variant="text" data-width="75" data-size="m"></span>
                </div>
            </div>
        </div>
    </div>
    <script src="techon-skeleton.js"></script>
</body>
</html>
