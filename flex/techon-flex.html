<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - Flex</title>
    <link rel="stylesheet" href="techon-flex.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { display: flex; flex-direction: column; gap: 24px; max-width: 800px; margin: 0 auto; }
        .demo-section { background: white; padding: 24px; border-radius: 12px; border: 1px solid #eee; }
        .demo-section h2 { margin: 0 0 20px 0; font-size: 16px; color: #666; text-transform: uppercase; }
        
        .demo-box {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            text-align: center;
            min-width: 60px;
        }
        
        .demo-box.blue { background: #e3f2fd; }
        .demo-box.green { background: #e8f5e9; }
        .demo-box.yellow { background: #fff3e0; }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-section">
            <h2>Direction</h2>
            <div class="to-flex" data-direction="row" data-gap="m" data-padding="m" style="background: #f5f5f5;">
                <div class="demo-box blue">Item 1</div>
                <div class="demo-box green">Item 2</div>
                <div class="demo-box yellow">Item 3</div>
            </div>
            
            <div class="to-flex" data-direction="column" data-gap="m" data-padding="m" style="background: #f5f5f5; margin-top: 16px;">
                <div class="demo-box blue">Item 1</div>
                <div class="demo-box green">Item 2</div>
                <div class="demo-box yellow">Item 3</div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Justify Content</h2>
            <div class="to-flex" data-justify="start" data-gap="m" data-padding="m" style="background: #f5f5f5;">
                <div class="demo-box blue">Start</div>
                <div class="demo-box green">Start</div>
            </div>
            
            <div class="to-flex" data-justify="center" data-gap="m" data-padding="m" style="background: #f5f5f5; margin-top: 16px;">
                <div class="demo-box blue">Center</div>
                <div class="demo-box green">Center</div>
            </div>
            
            <div class="to-flex" data-justify="between" data-gap="m" data-padding="m" style="background: #f5f5f5; margin-top: 16px;">
                <div class="demo-box blue">Between</div>
                <div class="demo-box green">Between</div>
            </div>
            
            <div class="to-flex" data-justify="end" data-gap="m" data-padding="m" style="background: #f5f5f5; margin-top: 16px;">
                <div class="demo-box blue">End</div>
                <div class="demo-box green">End</div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Align Items</h2>
            <div class="to-flex" data-align="start" data-gap="m" data-padding="m" style="background: #f5f5f5; height: 100px;">
                <div class="demo-box blue">Start</div>
                <div class="demo-box green" style="height: 60px;">Start</div>
            </div>
            
            <div class="to-flex" data-align="center" data-gap="m" data-padding="m" style="background: #f5f5f5; height: 100px; margin-top: 16px;">
                <div class="demo-box blue">Center</div>
                <div class="demo-box green" style="height: 60px;">Center</div>
            </div>
            
            <div class="to-flex" data-align="end" data-gap="m" data-padding="m" style="background: #f5f5f5; height: 100px; margin-top: 16px;">
                <div class="demo-box blue">End</div>
                <div class="demo-box green" style="height: 60px;">End</div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Gap Sizes</h2>
            <div class="to-flex" data-gap="xs" data-padding="m" style="background: #f5f5f5;">
                <div class="demo-box blue">XS</div>
                <div class="demo-box green">XS</div>
                <div class="demo-box yellow">XS</div>
            </div>
            
            <div class="to-flex" data-gap="l" data-padding="m" style="background: #f5f5f5; margin-top: 16px;">
                <div class="demo-box blue">L</div>
                <div class="demo-box green">L</div>
                <div class="demo-box yellow">L</div>
            </div>
            
            <div class="to-flex" data-gap="xl" data-padding="m" style="background: #f5f5f5; margin-top: 16px;">
                <div class="demo-box blue">XL</div>
                <div class="demo-box green">XL</div>
                <div class="demo-box yellow">XL</div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Wrap</h2>
            <div class="to-flex" data-wrap="wrap" data-gap="m" style="background: #f5f5f5; width: 300px; padding: 16px;">
                <div class="demo-box blue">Item 1</div>
                <div class="demo-box green">Item 2</div>
                <div class="demo-box yellow">Item 3</div>
                <div class="demo-box blue">Item 4</div>
                <div class="demo-box green">Item 5</div>
                <div class="demo-box yellow">Item 6</div>
            </div>
        </div>
    </div>
    <script src="techon-flex.js"></script>
</body>
</html>
