<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn Toggle Button</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #030303;
            color: #f0f0f0;
        }
        .to-toggle-button {
            padding: 8px 16px;
            border: 2px solid #1a1a1a;
            background: transparent;
            color: #a0a0a0;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .to-toggle-button:hover {
            border-color: #f0f0f0;
            color: #f0f0f0;
        }
        .to-toggle-button[data-selected="true"] {
            background: #f0f0f0;
            color: #030303;
            border-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>TechOn Toggle Button Component</h1>
    <h2>Toggle Buttons</h2>
    <button class="to-toggle-button" data-selected="false">Option 1</button>
    <button class="to-toggle-button" data-selected="true">Option 2</button>
    <button class="to-toggle-button" data-selected="false">Option 3</button>
    
    <h2>Hover Effect</h2>
    <button class="to-toggle-button">Hover me</button>
</body>
</html>
