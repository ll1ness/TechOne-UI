<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - Banner</title>
    <link rel="stylesheet" href="techon-banner.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { display: flex; flex-direction: column; gap: 24px; max-width: 600px; margin: 0 auto; }
        .demo-row { display: flex; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="to-banner">
            Free shipping on orders over $50
        </div>

        <div class="to-banner" data-radius="s">
            <span class="to-banner-icon">✓</span>
            Claim your free credits.
        </div>

        <div class="to-banner" data-solid="success-medium">
            <span class="to-banner-icon">✓</span>
            Operation completed successfully.
        </div>

        <div class="to-banner" data-solid="warning-medium">
            <span class="to-banner-icon">⚠</span>
            Please review your information before proceeding.
        </div>

        <div class="to-banner" data-solid="danger-medium">
            <span class="to-banner-icon">✗</span>
            Critical error detected in the system.
        </div>

        <div class="to-banner" data-horizontal="between">
            Accept our privacy policy to continue.
            <div class="to-row">
                <button class="to-button" data-variant="secondary">Decline</button>
                <button class="to-button">Accept</button>
            </div>
        </div>
    </div>
    <script src="techon-banner.js"></script>
</body>
</html>
