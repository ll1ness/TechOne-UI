<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - Toast</title>
    <link rel="stylesheet" href="techon-toast.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { max-width: 600px; margin: 0 auto; }
        .demo-section { background: white; padding: 24px; border-radius: 12px; border: 1px solid #eee; }
        .demo-section h2 { margin: 0 0 20px 0; font-size: 16px; color: #666; text-transform: uppercase; }
        .demo-row { display: flex; gap: 12px; flex-wrap: wrap; }
        
        .to-button {
            padding: 10px 20px;
            background: #000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .to-button.success { background: #10b981; }
        .to-button.danger { background: #ef4444; }
        .to-button.warning { background: #f59e0b; }
        .to-button.info { background: #3b82f6; }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-section">
            <h2>Toast Notifications</h2>
            <div class="demo-row">
                <button class="to-button success" onclick="toast.success('Success', 'Operation completed successfully')">Success</button>
                <button class="to-button danger" onclick="toast.error('Error', 'Something went wrong')">Error</button>
                <button class="to-button warning" onclick="toast.warning('Warning', 'Please check your input')">Warning</button>
                <button class="to-button info" onclick="toast.info('Info', 'New update available')">Info</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>With Title Only</h2>
            <div class="demo-row">
                <button class="to-button success" onclick="toast.show({ variant: 'success', title: 'Saved!' })">Title Only</button>
                <button class="to-button danger" onclick="toast.show({ variant: 'danger', title: 'Failed!' })">Title Only</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>With Description Only</h2>
            <div class="demo-row">
                <button class="to-button info" onclick="toast.show({ variant: 'info', description: 'This is a simple notification' })">Description Only</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>With Actions</h2>
            <div class="demo-row">
                <button class="to-button warning" onclick="toast.show({
                    variant: 'warning',
                    title: 'Unsaved Changes',
                    description: 'You have unsaved changes',
                    action: {
                        label: 'Save',
                        onClick: () => alert('Saving...')
                    }
                })">With Action</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Different Durations</h2>
            <div class="demo-row">
                <button class="to-button info" onclick="toast.info('Short', 'Disappears fast', 2000)">2 seconds</button>
                <button class="to-button info" onclick="toast.info('Long', 'Stays longer', 8000)">8 seconds</button>
                <button class="to-button info" onclick="toast.show({ variant: 'info', title: 'Persistent', duration: 0 })">Persistent</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Without Icon</h2>
            <div class="demo-row">
                <button class="to-button success" onclick="toast.show({ variant: 'success', title: 'No Icon', icon: false })">No Icon</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Position</h2>
            <div class="demo-row">
                <button onclick="toast.setPosition('top-right'); toast.info('Position', 'Top Right')">Top Right</button>
                <button onclick="toast.setPosition('top-left'); toast.info('Position', 'Top Left')">Top Left</button>
                <button onclick="toast.setPosition('bottom-right'); toast.info('Position', 'Bottom Right')">Bottom Right</button>
                <button onclick="toast.setPosition('bottom-left'); toast.info('Position', 'Bottom Left')">Bottom Left</button>
                <button onclick="toast.setPosition('top-center'); toast.info('Position', 'Top Center')">Top Center</button>
                <button onclick="toast.setPosition('bottom-center'); toast.info('Position', 'Bottom Center')">Bottom Center</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Multiple Toasts</h2>
            <div class="demo-row">
                <button class="to-button" onclick="
                    toast.success('First', 'This is toast #1');
                    setTimeout(() => toast.info('Second', 'This is toast #2'), 500);
                    setTimeout(() => toast.warning('Third', 'This is toast #3'), 1000);
                    setTimeout(() => toast.error('Fourth', 'This is toast #4'), 1500);
                ">Show 4 Toasts</button>
                
                <button class="to-button" onclick="toast.closeAll()">Close All</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Example Use Cases</h2>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button class="to-button success" onclick="toast.success('File uploaded', 'document.pdf has been uploaded successfully')">
                    Upload Success
                </button>
                
                <button class="to-button danger" onclick="toast.error('Upload failed', 'File size exceeds limit', 5000)">
                    Upload Failed
                </button>
                
                <button class="to-button warning" onclick="toast.show({
                    variant: 'warning',
                    title: 'Session expiring',
                    description: 'Your session will expire in 5 minutes',
                    action: {
                        label: 'Extend',
                        onClick: () => toast.success('Session extended')
                    }
                })">
                    Session Warning
                </button>
                
                <button class="to-button info" onclick="toast.show({
                    variant: 'info',
                    title: 'New message',
                    description: 'You have 3 unread messages',
                    action: {
                        label: 'View',
                        onClick: () => toast.info('Opening messages...')
                    }
                })">
                    New Message
                </button>
            </div>
        </div>
    </div>
    <script src="techon-toast.js"></script>
</body>
</html>
