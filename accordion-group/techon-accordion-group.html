<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - Accordion Group</title>
    <link rel="stylesheet" href="techon-accordion-group.css">
</head>
<body>
    <div class="to-accordion-group" data-size="m">
        <div class="to-accordion-group-item" data-open="true">
            <button class="to-accordion-group-trigger" aria-expanded="true">
                <span>First Item</span>
                <span class="to-accordion-group-icon">▼</span>
            </button>
            <div class="to-accordion-group-content">
                <div class="to-accordion-group-content-inner">
                    Content for the first item. This demonstrates how accordion groups work.
                </div>
            </div>
        </div>
        <div class="to-accordion-group-item" data-open="false">
            <button class="to-accordion-group-trigger" aria-expanded="false">
                <span>Second Item</span>
                <span class="to-accordion-group-icon">▼</span>
            </button>
            <div class="to-accordion-group-content">
                <div class="to-accordion-group-content-inner">
                    Content for the second item. This item starts closed.
                </div>
            </div>
        </div>
        <div class="to-accordion-group-item" data-open="false">
            <button class="to-accordion-group-trigger" aria-expanded="false">
                <span>Third Item</span>
                <span class="to-accordion-group-icon">▼</span>
            </button>
            <div class="to-accordion-group-content">
                <div class="to-accordion-group-content-inner">
                    Content for the third item with additional details.
                    <p style="margin-top: 8px;">You can put any HTML content here.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="techon-accordion-group.js"></script>
</body>
</html>
