<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - Avatar</title>
    <link rel="stylesheet" href="techon-avatar.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { display: flex; flex-direction: column; gap: 40px; max-width: 800px; margin: 0 auto; }
        .demo-section { background: white; padding: 24px; border-radius: 12px; border: 1px solid #eee; }
        .demo-section h2 { margin: 0 0 20px 0; font-size: 16px; color: #666; text-transform: uppercase; }
        .demo-row { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-section">
            <h2>Avatar</h2>
            <div class="demo-row">
                <div class="to-avatar" data-size="l" data-src="/images/avatar.jpg">JD</div>
                <div class="to-avatar" data-size="l" data-value="Q">Q</div>
                <div class="to-avatar" data-size="l" data-empty="true"></div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Empty</h2>
            <div class="demo-row">
                <div class="to-avatar" data-size="l" data-empty="true"></div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Icon</h2>
            <div class="demo-row">
                <div class="to-avatar" data-size="l" data-icon="sparkle">✨</div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Sizes (REM)</h2>
            <div class="demo-row">
                <div class="to-avatar" data-size="1.5" data-value="A">A</div>
                <div class="to-avatar" data-size="2.5" data-value="B">B</div>
                <div class="to-avatar" data-size="3.5" data-value="C">C</div>
                <div class="to-avatar" data-size="4.5" data-value="D">D</div>
                <div class="to-avatar" data-size="5.5" data-value="E">E</div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Sizes (T-shirt)</h2>
            <div class="demo-row">
                <div class="to-avatar" data-size="xs" data-value="A">A</div>
                <div class="to-avatar" data-size="s" data-value="B">B</div>
                <div class="to-avatar" data-size="m" data-value="C">C</div>
                <div class="to-avatar" data-size="l" data-value="D">D</div>
                <div class="to-avatar" data-size="xl" data-value="E">E</div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Status indicator</h2>
            <div class="demo-row">
                <div class="to-avatar" data-size="l" data-value="G" data-status-indicator='{"color":"green"}'>G</div>
                <div class="to-avatar" data-size="l" data-value="Y" data-status-indicator='{"color":"yellow"}'>Y</div>
                <div class="to-avatar" data-size="l" data-value="R" data-status-indicator='{"color":"red"}'>R</div>
                <div class="to-avatar" data-size="l" data-value="G" data-status-indicator='{"color":"gray"}'>G</div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Loading state</h2>
            <div class="demo-row">
                <div class="to-avatar" data-size="l" data-loading="true">L</div>
                <div class="to-avatar" data-size="m" data-loading="true">M</div>
                <div class="to-avatar" data-size="s" data-loading="true">S</div>
            </div>
        </div>
    </div>
    <script src="techon-avatar.js"></script>
</body>
</html>
