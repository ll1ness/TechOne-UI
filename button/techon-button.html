<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - Button</title>
    <link rel="stylesheet" href="techon-button.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { display: flex; flex-direction: column; gap: 24px; max-width: 600px; margin: 0 auto; }
        .demo-section { background: white; padding: 24px; border-radius: 12px; border: 1px solid #eee; }
        .demo-section h2 { margin: 0 0 20px 0; font-size: 16px; color: #666; text-transform: uppercase; }
        .demo-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-section">
            <h2>Variants</h2>
            <div class="demo-row">
                <button class="to-button" data-variant="primary">Primary</button>
                <button class="to-button" data-variant="secondary">Secondary</button>
                <button class="to-button" data-variant="tertiary">Tertiary</button>
                <button class="to-button" data-variant="danger">Danger</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Sizes</h2>
            <div class="demo-row">
                <button class="to-button" data-variant="primary" data-size="s">Small</button>
                <button class="to-button" data-variant="primary" data-size="m">Medium</button>
                <button class="to-button" data-variant="primary" data-size="l">Large</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Fill width</h2>
            <div class="demo-row" style="max-width: 300px;">
                <button class="to-button" data-variant="primary">Default</button>
                <button class="to-button" data-variant="primary" data-fill-width="true">Filled</button>
            </div>
        </div>
    </div>
    <script src="techon-button.js"></script>
</body>
</html>
