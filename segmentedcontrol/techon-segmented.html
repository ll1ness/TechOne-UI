<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - SegmentedControl</title>
    <link rel="stylesheet" href="techon-segmented.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { display: flex; flex-direction: column; gap: 24px; max-width: 800px; margin: 0 auto; }
        .demo-section { background: white; padding: 24px; border-radius: 12px; border: 1px solid #eee; }
        .demo-section h2 { margin: 0 0 20px 0; font-size: 16px; color: #666; text-transform: uppercase; }
        .demo-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-section">
            <h2>Basic Segmented Control</h2>
            <div class="to-segmented">
                <button class="to-segmented-item" data-value="day" data-selected="true">Day</button>
                <button class="to-segmented-item" data-value="week">Week</button>
                <button class="to-segmented-item" data-value="month">Month</button>
                <button class="to-segmented-item" data-value="year">Year</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>With Icons</h2>
            <div class="demo-row">
                <div class="to-segmented">
                    <button class="to-segmented-item" data-value="list" data-selected="true">
                        <span class="to-icon">☰</span>
                        List
                    </button>
                    <button class="to-segmented-item" data-value="grid">
                        <span class="to-icon">▦</span>
                        Grid
                    </button>
                    <button class="to-segmented-item" data-value="table">
                        <span class="to-icon">⎔</span>
                        Table
                    </button>
                </div>
                
                <div class="to-segmented">
                    <button class="to-segmented-item" data-value="day" data-selected="true">D</button>
                    <button class="to-segmented-item" data-value="week">W</button>
                    <button class="to-segmented-item" data-value="month">M</button>
                    <button class="to-segmented-item" data-value="year">Y</button>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Sizes</h2>
            <div class="demo-row" style="flex-direction: column; align-items: flex-start;">
                <div class="to-segmented" data-size="s">
                    <button class="to-segmented-item" data-selected="true">Small</button>
                    <button class="to-segmented-item">Small</button>
                    <button class="to-segmented-item">Small</button>
                </div>
                
                <div class="to-segmented" data-size="m">
                    <button class="to-segmented-item" data-selected="true">Medium</button>
                    <button class="to-segmented-item">Medium</button>
                    <button class="to-segmented-item">Medium</button>
                </div>
                
                <div class="to-segmented" data-size="l">
                    <button class="to-segmented-item" data-selected="true">Large</button>
                    <button class="to-segmented-item">Large</button>
                    <button class="to-segmented-item">Large</button>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Radius</h2>
            <div class="demo-row" style="flex-direction: column; align-items: flex-start;">
                <div class="to-segmented" data-radius="none">
                    <button class="to-segmented-item" data-selected="true">None</button>
                    <button class="to-segmented-item">Radius</button>
                </div>
                
                <div class="to-segmented" data-radius="s">
                    <button class="to-segmented-item" data-selected="true">Small</button>
                    <button class="to-segmented-item">Radius</button>
                </div>
                
                <div class="to-segmented" data-radius="m">
                    <button class="to-segmented-item" data-selected="true">Medium</button>
                    <button class="to-segmented-item">Radius</button>
                </div>
                
                <div class="to-segmented" data-radius="l">
                    <button class="to-segmented-item" data-selected="true">Large</button>
                    <button class="to-segmented-item">Radius</button>
                </div>
                
                <div class="to-segmented" data-radius="xl">
                    <button class="to-segmented-item" data-selected="true">XL</button>
                    <button class="to-segmented-item">Radius</button>
                </div>
                
                <div class="to-segmented" data-radius="full">
                    <button class="to-segmented-item" data-selected="true">Full</button>
                    <button class="to-segmented-item">Radius</button>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Fill Width</h2>
            <div class="demo-row" style="width: 100%;">
                <div class="to-segmented" data-fill="true">
                    <button class="to-segmented-item" data-selected="true">Option 1</button>
                    <button class="to-segmented-item">Option 2</button>
                    <button class="to-segmented-item">Option 3</button>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Vertical Orientation</h2>
            <div class="demo-row">
                <div class="to-segmented" data-vertical="true">
                    <button class="to-segmented-item" data-selected="true">Top</button>
                    <button class="to-segmented-item">Middle</button>
                    <button class="to-segmented-item">Bottom</button>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Disabled Items</h2>
            <div class="to-segmented">
                <button class="to-segmented-item" data-selected="true">Enabled</button>
                <button class="to-segmented-item">Enabled</button>
                <button class="to-segmented-item" disabled>Disabled</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>Use Cases</h2>
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div>
                    <h3 style="margin: 0 0 8px 0; font-size: 14px;">View Mode</h3>
                    <div class="to-segmented">
                        <button class="to-segmented-item" data-value="grid" data-selected="true">
                            <span class="to-icon">▦</span> Grid
                        </button>
                        <button class="to-segmented-item" data-value="list">
                            <span class="to-icon">☰</span> List
                        </button>
                        <button class="to-segmented-item" data-value="compact">
                            <span class="to-icon">⎔</span> Compact
                        </button>
                    </div>
                </div>
                
                <div>
                    <h3 style="margin: 0 0 8px 0; font-size: 14px;">Time Range</h3>
                    <div class="to-segmented">
                        <button class="to-segmented-item" data-value="1h">1H</button>
                        <button class="to-segmented-item" data-value="24h" data-selected="true">24H</button>
                        <button class="to-segmented-item" data-value="7d">7D</button>
                        <button class="to-segmented-item" data-value="30d">30D</button>
                        <button class="to-segmented-item" data-value="all">All</button>
                    </div>
                </div>
                
                <div>
                    <h3 style="margin: 0 0 8px 0; font-size: 14px;">Text Alignment</h3>
                    <div class="to-segmented">
                        <button class="to-segmented-item" data-value="left">
                            <span class="to-icon">⬅</span> Left
                        </button>
                        <button class="to-segmented-item" data-value="center" data-selected="true">
                            <span class="to-icon">⬌</span> Center
                        </button>
                        <button class="to-segmented-item" data-value="right">
                            <span class="to-icon">➡</span> Right
                        </button>
                    </div>
                </div>
                
                <div>
                    <h3 style="margin: 0 0 8px 0; font-size: 14px;">Font Weight</h3>
                    <div class="to-segmented">
                        <button class="to-segmented-item" data-value="regular">Regular</button>
                        <button class="to-segmented-item" data-value="medium" data-selected="true">Medium</button>
                        <button class="to-segmented-item" data-value="bold">Bold</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>With Badges</h2>
            <div class="to-segmented">
                <button class="to-segmented-item" data-value="inbox" data-selected="true">
                    Inbox
                    <span class="to-badge" data-variant="primary" data-size="s">12</span>
                </button>
                <button class="to-segmented-item" data-value="sent">
                    Sent
                    <span class="to-badge" data-variant="muted" data-size="s">3</span>
                </button>
                <button class="to-segmented-item" data-value="drafts">
                    Drafts
                    <span class="to-badge" data-variant="warning" data-size="s">2</span>
                </button>
            </div>
        </div>
    </div>
    <script src="techon-segmented.js"></script>
    <script src="techon-badge.js"></script>
</body>
</html>
