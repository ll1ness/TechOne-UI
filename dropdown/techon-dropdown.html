<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - Dropdown</title>
    <link rel="stylesheet" href="techon-dropdown.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { display: flex; flex-direction: column; gap: 24px; max-width: 800px; margin: 0 auto; }
        .demo-section { background: white; padding: 24px; border-radius: 12px; border: 1px solid #eee; }
        .demo-section h2 { margin: 0 0 20px 0; font-size: 16px; color: #666; text-transform: uppercase; }
        .demo-row { display: flex; gap: 40px; flex-wrap: wrap; }
        
        .to-button {
            padding: 10px 20px;
            background: #000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .to-button::after {
            content: "▼";
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-section">
            <h2>Basic Dropdown</h2>
            <div class="demo-row">
                <div class="to-dropdown">
                    <div class="to-dropdown-trigger">
                        <button class="to-button">Menu</button>
                    </div>
                    <div class="to-dropdown-menu">
                        <div class="to-dropdown-item" data-value="profile">Profile</div>
                        <div class="to-dropdown-item" data-value="settings">Settings</div>
                        <div class="to-dropdown-item" data-value="help">Help</div>
                        <div class="to-dropdown-divider"></div>
                        <div class="to-dropdown-item" data-value="logout">Logout</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>With Icons</h2>
            <div class="demo-row">
                <div class="to-dropdown">
                    <div class="to-dropdown-trigger">
                        <button class="to-button">Actions</button>
                    </div>
                    <div class="to-dropdown-menu">
                        <div class="to-dropdown-item" data-value="edit">✏️ Edit</div>
                        <div class="to-dropdown-item" data-value="copy">📋 Copy</div>
                        <div class="to-dropdown-item" data-value="delete">🗑️ Delete</div>
                        <div class="to-dropdown-divider"></div>
                        <div class="to-dropdown-item" data-value="export">📤 Export</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>With Header and Disabled Items</h2>
            <div class="demo-row">
                <div class="to-dropdown">
                    <div class="to-dropdown-trigger">
                        <button class="to-button">Settings</button>
                    </div>
                    <div class="to-dropdown-menu">
                        <div class="to-dropdown-header">Account</div>
                        <div class="to-dropdown-item" data-value="profile">Profile</div>
                        <div class="to-dropdown-item" data-value="security">Security</div>
                        
                        <div class="to-dropdown-header">Preferences</div>
                        <div class="to-dropdown-item" data-value="theme">Theme</div>
                        <div class="to-dropdown-item" data-value="notifications">Notifications</div>
                        <div class="to-dropdown-item" data-disabled="true" data-value="advanced">Advanced (coming soon)</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Position Variants</h2>
            <div class="demo-row" style="justify-content: space-between;">
                <div class="to-dropdown" data-position="right">
                    <div class="to-dropdown-trigger">
                        <button class="to-button">Right Aligned</button>
                    </div>
                    <div class="to-dropdown-menu">
                        <div class="to-dropdown-item">Item 1</div>
                        <div class="to-dropdown-item">Item 2</div>
                        <div class="to-dropdown-item">Item 3</div>
                    </div>
                </div>

                <div class="to-dropdown" style="margin-top: 100px;" data-position="top">
                    <div class="to-dropdown-trigger">
                        <button class="to-button">Top Position</button>
                    </div>
                    <div class="to-dropdown-menu">
                        <div class="to-dropdown-item">Item 1</div>
                        <div class="to-dropdown-item">Item 2</div>
                        <div class="to-dropdown-item">Item 3</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="techon-dropdown.js"></script>
</body>
</html>
