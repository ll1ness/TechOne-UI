<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechOn UI - Arrow</title>
    <link rel="stylesheet" href="techon-arrow.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; background: #f9f9f9; }
        .demo-container { display: flex; flex-direction: column; gap: 40px; max-width: 800px; margin: 0 auto; }
        .demo-section { background: white; padding: 24px; border-radius: 12px; border: 1px solid #eee; }
        .demo-section h2 { margin: 0 0 20px 0; font-size: 16px; color: #666; text-transform: uppercase; }
        .demo-row { display: flex; gap: 40px; flex-wrap: wrap; align-items: center; }
        .demo-item { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #f5f5f5; border-radius: 8px; }
        .demo-item-dark { background: #333; color: white; }
        .to-arrow { font-size: 24px; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-section">
            <h2>Simple usage</h2>
            <div class="demo-row">
                <div class="demo-item" id="arrow-trigger-1">
                    <span>Simple usage</span>
                    <span class="to-arrow" data-trigger="#arrow-trigger-1" data-scale="1">→</span>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Customized usage</h2>
            <div class="demo-row">
                <div class="demo-item demo-item-dark" id="arrow-trigger-2">
                    <span>Customized usage</span>
                    <span class="to-arrow" data-trigger="#arrow-trigger-2" data-color="on-solid" data-scale="1.2">→</span>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Scale variations</h2>
            <div class="demo-row">
                <div class="demo-item" id="arrow-trigger-3">
                    <span>Scale 0.8</span>
                    <span class="to-arrow" data-trigger="#arrow-trigger-3" data-scale="0.8">→</span>
                </div>
                <div class="demo-item" id="arrow-trigger-4">
                    <span>Scale 1.0</span>
                    <span class="to-arrow" data-trigger="#arrow-trigger-4" data-scale="1">→</span>
                </div>
                <div class="demo-item" id="arrow-trigger-5">
                    <span>Scale 1.2</span>
                    <span class="to-arrow" data-trigger="#arrow-trigger-5" data-scale="1.2">→</span>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>Color variations</h2>
            <div class="demo-row">
                <div class="demo-item" id="arrow-trigger-6">
                    <span>On background</span>
                    <span class="to-arrow" data-trigger="#arrow-trigger-6" data-color="on-background">→</span>
                </div>
                <div class="demo-item demo-item-dark" id="arrow-trigger-7">
                    <span>On solid</span>
                    <span class="to-arrow" data-trigger="#arrow-trigger-7" data-color="on-solid">→</span>
                </div>
            </div>
        </div>
    </div>
    <script src="techon-arrow.js"></script>
</body>
</html>
